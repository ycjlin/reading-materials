# =============================================================================
# /etc/haproxy/haproxy.cfg
# OpenResty(限流) --> HAProxy(這一層,只做 LB + health check) --> MinIO nodes
# 這層刻意「不做」限流：限流決策要在有 bucket 語意的 OpenResty 做。
# 這裡只留最後一道保險（每來源連線數）避免單一 OpenResty 節點失控。
# =============================================================================

global
    log /dev/log local0 info
    maxconn 200000
    nbthread 8
    tune.bufsize 32768
    tune.h2.initial-window-size 1048576
    stats socket /var/run/haproxy.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

defaults
    mode                http
    log                 global
    option              httplog
    option              dontlognull
    option              http-keep-alive
    option              forwardfor except 127.0.0.0/8
    timeout connect     5s
    timeout client      900s
    timeout server      900s
    timeout http-keep-alive 60s
    timeout tunnel      3600s
    retries             2
    maxconn             100000

#------------------------------------------------------------------------------
frontend s3_front
    bind 0.0.0.0:9000
    # 只接受來自 OpenResty 的流量；任何人繞過 OpenResty 直連 = 繞過限流
    acl from_gateway src 10.20.0.21 10.20.0.22 10.20.0.23
    http-request deny deny_status 403 unless from_gateway

    # 保險絲：單一來源 IP 併發上限（正常不會踩到）
    stick-table type ip size 1m expire 60s store conn_cur,http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 503 if { sc_conn_cur(0) gt 60000 }

    # 不要動 Host / Authorization / x-amz-*，SigV4 會壞
    option forwardfor
    default_backend s3_minio

#------------------------------------------------------------------------------
backend s3_minio
    balance leastconn
    option httpchk GET /minio/health/live
    http-check expect status 200
    # MinIO 建議關掉 HAProxy 端的 body 緩衝，走串流
    http-reuse safe

    default-server inter 3s fastinter 1s downinter 2s rise 2 fall 3 \
                   maxconn 20000 check observe layer7 error-limit 10 on-error mark-down

    server minio1 10.20.1.11:9000
    server minio2 10.20.1.12:9000
    server minio3 10.20.1.13:9000
    server minio4 10.20.1.14:9000

#------------------------------------------------------------------------------
listen stats
    bind 0.0.0.0:8404
    stats enable
    stats uri /haproxy
    stats refresh 5s
