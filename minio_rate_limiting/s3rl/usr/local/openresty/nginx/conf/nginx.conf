# =============================================================================
# /usr/local/openresty/nginx/conf/nginx.conf
# OpenResty S3 Gateway — bucket-level rate limiting / throttling
# Client --> [OpenResty :443] --> [HAProxy :9000] --> [MinIO cluster]
# =============================================================================

user                    nginx nginx;
worker_processes        auto;
worker_cpu_affinity     auto;
worker_rlimit_nofile    1048576;
worker_shutdown_timeout 30s;

error_log  /var/log/openresty/error.log warn;
pid        /var/run/openresty.pid;

events {
    worker_connections  65535;
    multi_accept        on;
    use                 epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ---------------------------------------------------------------------
    # S3 correctness —— 這幾行動到就會炸 SigV4
    # ---------------------------------------------------------------------
    merge_slashes           off;   # S3 object key 允許連續 '/'
    underscores_in_headers  on;
    ignore_invalid_headers  off;   # 放行 x-amz-* 之外的奇怪 header
    server_tokens           off;
    absolute_redirect       off;

    # ---------------------------------------------------------------------
    # Timeouts / buffers（大物件 + LOSF 混合流量）
    # ---------------------------------------------------------------------
    sendfile                 on;
    tcp_nopush               on;
    tcp_nodelay              on;
    keepalive_timeout        75s;
    keepalive_requests       100000;
    client_header_timeout    60s;
    client_body_timeout      300s;
    send_timeout             300s;
    client_max_body_size     0;      # 大小交給 MinIO 判斷（單次 PUT 上限 5GiB）
    client_body_buffer_size  1m;
    proxy_max_temp_file_size 0;      # 絕不落地暫存檔
    lingering_close          on;     # 429/503 時把未讀的 body 收乾淨，keepalive 才不會壞
    lingering_time           10s;
    lingering_timeout        2s;

    # ---------------------------------------------------------------------
    # Logging
    # ---------------------------------------------------------------------
    log_format s3rl escape=json
      '{"ts":"$time_iso8601","rip":"$remote_addr","xff":"$http_x_forwarded_for",'
      '"host":"$http_host","method":"$request_method","uri":"$request_uri",'
      '"status":$status,"in":$request_length,"out":$bytes_sent,'
      '"rt":$request_time,"urt":"$upstream_response_time","ups":"$upstream_addr",'
      '"bucket":"$s3rl_bucket","op":"$s3rl_op","ak":"$s3rl_ak",'
      '"rl":"$s3rl_action","delay":"$s3rl_delay","reqid":"$s3rl_reqid"}';

    access_log /var/log/openresty/s3-access.log s3rl buffer=512k flush=2s;

    # ---------------------------------------------------------------------
    # Lua runtime
    # ---------------------------------------------------------------------
    lua_package_path      "/usr/local/openresty/lualib/?.lua;/usr/local/openresty/lualib/?/init.lua;;";
    lua_code_cache        on;
    lua_socket_log_errors off;

    # leaky-bucket 狀態：每個 (bucket, op) 一組 key，估 ~64B/key
    lua_shared_dict s3rl_req    256m;
    lua_shared_dict s3rl_conn   128m;
    lua_shared_dict s3rl_count  128m;
    lua_shared_dict s3rl_conf    16m;
    lua_shared_dict s3rl_stats   64m;
    lua_shared_dict s3rl_lock     1m;

    init_by_lua_block {
        local ok, err = pcall(function()
            require("s3rl.config").init({
                path = "/etc/openresty/s3rl/limits.json",
                -- virtual-hosted-style 的 base domain（可多個）
                vhost_domains = { "s3.fab.local", "minio.fab.local" },
            })
        end)
        if not ok then ngx.log(ngx.ERR, "[s3rl] init failed: ", err) end
    }

    init_worker_by_lua_block {
        require("s3rl.config").start_watcher(5)   -- 每 5s 檢查設定檔
    }

    # ---------------------------------------------------------------------
    # Upstream = HAProxy（VIP 或雙節點）
    # ---------------------------------------------------------------------
    upstream s3_haproxy {
        least_conn;
        server 10.20.0.11:9000 max_fails=3 fail_timeout=5s;
        server 10.20.0.12:9000 max_fails=3 fail_timeout=5s;

        keepalive             1024;
        keepalive_timeout     60s;
        keepalive_requests    100000;
    }

    include /usr/local/openresty/nginx/conf/conf.d/*.conf;
}
