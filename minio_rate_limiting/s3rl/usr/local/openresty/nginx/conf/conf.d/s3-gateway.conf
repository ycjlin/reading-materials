# =============================================================================
# /usr/local/openresty/nginx/conf/conf.d/s3-gateway.conf
# =============================================================================

server {
    listen      443 ssl reuseport backlog=65535;
    listen [::]:443 ssl reuseport;
    http2 on;

    # path-style + virtual-hosted-style 都要收
    server_name s3.fab.local *.s3.fab.local minio.fab.local *.minio.fab.local;

    ssl_certificate         /etc/openresty/ssl/s3.fab.local.fullchain.pem;
    ssl_certificate_key     /etc/openresty/ssl/s3.fab.local.key;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache       shared:SSL:200m;
    ssl_session_timeout     1d;
    ssl_session_tickets     off;

    # 若 OpenResty 前面還有 L4 LB / F5，取回真實 client IP
    set_real_ip_from  10.20.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # ---- 健康檢查：不限流、不記帳 --------------------------------------
    location ^~ /minio/health/ {
        access_log off;
        proxy_http_version 1.1;
        proxy_set_header Host       $http_host;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout    3s;
        proxy_pass http://s3_haproxy;
    }

    # ---- s3rl 管理面（僅內網）------------------------------------------
    location ^~ /-/s3rl/ {
        allow 10.20.0.0/16;
        allow 127.0.0.1;
        deny  all;
        access_log off;
        default_type application/json;
        content_by_lua_block { require("s3rl.admin").route() }
    }

    # ---- S3 資料面 ------------------------------------------------------
    location / {
        # log_format 用到的變數必須先 set 出來
        set $s3rl_bucket "-";
        set $s3rl_op     "-";
        set $s3rl_ak     "-";
        set $s3rl_action "pass";
        set $s3rl_delay  "0";
        set $s3rl_reqid  "-";

        access_by_lua_block { require("s3rl.handler").access() }
        log_by_lua_block    { require("s3rl.handler").log()    }

        proxy_http_version 1.1;

        # SigV4 會簽 Host，這行改掉整個 cluster 的簽章就全錯
        proxy_set_header Host              $http_host;
        proxy_set_header Connection        "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上傳/下載全部走串流；一旦緩衝，
        # STREAMING-AWS4-HMAC-SHA256-PAYLOAD 的 chunk signature 會對不上
        proxy_request_buffering off;
        proxy_buffering         off;

        proxy_connect_timeout  5s;
        proxy_send_timeout   900s;
        proxy_read_timeout   900s;
        proxy_next_upstream  error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        # 用 $request_uri 保留原始 %XX 編碼與連續 '/'，
        # 否則 nginx 正規化後的 canonical URI 會與 client 簽的不同
        proxy_pass http://s3_haproxy$request_uri;
    }
}

# HTTP -> HTTPS（S3 client 一般直接走 443，這裡只做保險）
server {
    listen 80 reuseport;
    server_name _;
    location ^~ /minio/health/ { return 200 "ok\n"; }
    location / { return 301 https://$http_host$request_uri; }
}
